name: Android

# Push a tag like android-v0.1.0 to build the signed APK and attach it to a draft release.
# Publish the draft WITHOUT making it the latest release (desktop updates and the site read "latest"):
#   gh release edit android-v0.1.0 --draft=false --latest=false
on:
  push:
    tags: ['android-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trashee_android
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Android platform
        run: sdkmanager "platforms;android-37.0"
      - uses: gradle/actions/setup-gradle@v4

      - name: Version from the tag
        run: |
          if [[ "$GITHUB_REF_NAME" == android-v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#android-v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0" >> "$GITHUB_ENV"
          fi

      - run: ./gradlew testDebugUnitTest

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::The ANDROID_KEYSTORE_B64 secret is missing: an unsigned APK cannot be installed or updated."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - run: ./gradlew assembleRelease -PversionName="$VERSION"

      - name: Name the files
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/trashee-android-$VERSION.apk"
          (cd out && sha256sum "trashee-android-$VERSION.apk" > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          make_latest: 'false'
          name: trashee для Android ${{ env.VERSION }}
          body_path: trashee_android/RELEASE_NOTES.md
          files: |
            trashee_android/out/*.apk
            trashee_android/out/SHA256SUMS.txt
