name: Release

# Push a tag like v1.0.0 to build the installers for macOS, Windows and Linux and the signed Android APK,
# and attach all of them to ONE draft release. Check the draft, then publish it from the Releases page.
# The notes of the release are release-notes/<version>.md. Running the workflow by hand builds everything
# and keeps the files as artifacts without making a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            flags: --mac
          - os: windows-latest
            flags: --win
          - os: ubuntu-latest
            flags: --linux
    runs-on: ${{ matrix.os }}
    env:
      # No signing certificates are configured, so do not go looking for them.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx electron-builder ${{ matrix.flags }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: trashee-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.tar.gz

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trashee_android
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # The runner image already has the Android SDK; it only needs the licenses and the newest platform.
      - name: Android platform
        run: |
          SDKM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37.0"
      - uses: gradle/actions/setup-gradle@v4

      - name: Version from the tag
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0" >> "$GITHUB_ENV"
          fi

      - run: ./gradlew testDebugUnitTest

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::The ANDROID_KEYSTORE_B64 secret is missing: an unsigned APK cannot be installed or updated."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - run: ./gradlew assembleRelease -PversionName="$VERSION"

      - run: cp app/build/outputs/apk/release/app-release.apk "trashee-android-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: trashee-android
          if-no-files-found: error
          path: trashee_android/trashee-android-*.apk

  # One job creates the release, so the builds cannot race each other into several half-empty drafts.
  release:
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: |
          ls -l
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes
        run: |
          NOTES="release-notes/${GITHUB_REF_NAME#v}.md"
          if [ -f "$NOTES" ]; then echo "NOTES_FILE=$NOTES" >> "$GITHUB_ENV"; fi

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: trashee ${{ github.ref_name }}
          body_path: ${{ env.NOTES_FILE }}
          generate_release_notes: ${{ env.NOTES_FILE == '' }}
          files: artifacts/*
