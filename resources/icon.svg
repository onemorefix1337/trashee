<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202026" />
      <stop offset="1" stop-color="#060607" />
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b8b" />
      <stop offset="0.55" stop-color="#ff9a62" />
      <stop offset="1" stop-color="#8f6bff" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="58%" r="52%">
      <stop offset="0" stop-color="#ff6b8b" stop-opacity="0.38" />
      <stop offset="1" stop-color="#ff6b8b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.5" />
    </filter>
    <filter id="soften" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26" />
    </filter>
    <clipPath id="clip">
      <rect x="100" y="100" width="824" height="824" rx="190" />
    </clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#bg)" />
  </g>

  <g clip-path="url(#clip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)" />
    <rect x="100" y="100" width="824" height="412" fill="url(#shine)" />

    <!-- the same five bars, blurred, as a halo -->
    <g fill="url(#bar)" opacity="0.55" filter="url(#soften)">
      <rect x="280" y="412" width="64" height="200" rx="32" />
      <rect x="380" y="332" width="64" height="360" rx="32" />
      <rect x="480" y="262" width="64" height="500" rx="32" />
      <rect x="580" y="362" width="64" height="300" rx="32" />
      <rect x="680" y="432" width="64" height="160" rx="32" />
    </g>
    <g fill="url(#bar)">
      <rect x="280" y="412" width="64" height="200" rx="32" />
      <rect x="380" y="332" width="64" height="360" rx="32" />
      <rect x="480" y="262" width="64" height="500" rx="32" />
      <rect x="580" y="362" width="64" height="300" rx="32" />
      <rect x="680" y="432" width="64" height="160" rx="32" />
    </g>
  </g>

  <rect x="101.5" y="101.5" width="821" height="821" rx="188.5" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="3" />
</svg>
